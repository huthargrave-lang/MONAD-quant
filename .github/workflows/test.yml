name: Tests

on:
  push:
    branches: [main, development, "claude/**", "fix-**"]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          # Dev/test extras: httpx (dashboard TestClient), matplotlib, pytest.
          pip install -r requirements-dev.txt
          # Runtime deps (jinja2/plotly/python-dotenv etc.) — without these,
          # tests/test_dashboard.py and tests/test_fetcher.py error at COLLECTION
          # (plotly / dotenv imports) and are silently dropped from the run.
          pip install -r requirements.txt
          # Libraries the tests import directly. Tests stub ib_insync/yfinance where
          # possible, so the CI install is kept lean and explicit.
          pip install pandas numpy fastapi httpx ib_insync yfinance apscheduler

      # H12/DP-5: context-layer integrity is asserted by the test suite, but the
      # LINT EXIT CODE is not — `ctx web --lint` returns non-zero when the research
      # web has dangling links, an undeclared superseder, or a live node relying on a
      # superseded one. Gating on it here means a merge cannot land those. This
      # deliberately does NOT gate the live-trader preflight: see RESEARCH_WEB.md
      # F187 for why a documentation defect must not be able to block arming a bot.
      - name: Context-layer integrity (ctx health + web --lint)
        run: |
          python tools/ctx.py health
          python tools/ctx.py web --lint

      - name: Run the full test suite (with coverage)
        run: |
          coverage run --source=src,live -m pytest tests/ -v
          # Visibility: full report (src + live), missing lines annotated.
          coverage report -m
          # Gate: fail if the offline strategy core (src/) regresses below the
          # floor. Baseline at introduction was ~71%; the floor leaves margin
          # while still catching real coverage regressions. live/ (trader/broker/
          # dashboard) is reported but not yet gated — raise this once B7 lands.
          coverage report --include="src/*" --fail-under=65
