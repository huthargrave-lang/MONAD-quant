name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pytest

      - name: Run tests
        run: |
          python -m pytest tests/test_signals.py tests/test_config.py tests/test_execution_model.py tests/test_state.py -v
