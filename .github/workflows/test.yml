name: Tests

on:
  push:
    branches: [main, "claude/**", "pi-ops-automation", "fix-**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          # Dev/test extras: httpx (dashboard TestClient), matplotlib, pytest.
          pip install -r requirements-dev.txt
          # Libraries the tests import directly. Tests stub ib_insync/yfinance where
          # possible, so the CI install is kept lean and explicit.
          pip install pandas numpy fastapi httpx ib_insync yfinance apscheduler

      - name: Run the full test suite
        run: |
          python -m pytest tests/ -v
