name: Publish GitHub Pages

# Static snapshot of the public read-only surfaces (stock screener + context map),
# built by tools/export_pages.py. Static on purpose: the data changes only on commit,
# so a live server would add attack surface (public process, SQLite mounts) for zero
# freshness gain. live/** is fenced and never published.
#
# The cron exists for the SCREENER DATA, not the code: fundamentals rot even when the
# repo is idle, and each run re-fetches them best-effort. A failed fetch publishes the
# absence panel — never a stale table dressed up as fresh.
#
# DAILY, at 01:17 UTC — was weekly (Mondays 11:17 UTC), which is replaced rather than
# kept alongside: two schedules for one decision is two things to keep in agreement.
#
#   * 01:17 UTC is 21:17 ET in summer, 20:17 ET in winter — a clear few hours after the
#     16:00 ET close, so the session's daily bar has settled before it is fetched. A
#     morning cron (the old 11:17 UTC = 07:17 ET) ran BEFORE the open, so its freshest
#     possible price bar was already a day old.
#   * :17 rather than :00 deliberately. GitHub queues scheduled workflows on the hour
#     and delays them under load; an odd minute is the documented way to avoid it.
#   * Every day, weekends included. Prices do not move then, but TONE does — it is
#     scored from news RSS, which is the most perishable thing this page publishes and
#     the reason a weekly cadence was the wrong one.
#
# Cost is ~7 min per run (measured), most of it the per-ticker Yahoo tone leg. Public
# repos bill no Actions minutes, so the cadence is not a budget question.
#
# NOT solved by this: GitHub disables scheduled workflows in a public repo after 60 days
# with no repository activity, and workflow runs do not themselves count as activity.
# A daily cron makes an idle repo fresher, not immortal.

on:
  push:
    branches: [development]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  # write, not read, for exactly one thing: the daily tone rows are pushed to the
  # `tone-ledger` branch. Every refresh used to OVERWRITE the snapshot, so weeks of
  # scheduled runs had produced one observation — the latest. The ledger is the residue.
  # A dedicated branch rather than development, because test.yml and pages.yml both
  # trigger on development pushes: ~365 bot commits a year there would mean ~365
  # spurious CI runs and a self-trigger loop here. Bonus the header above already
  # wants: daily pushes are repository activity, which is what actually staves off
  # the 60-day scheduled-workflow disablement — workflow runs alone do not.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # yfinance brings pandas/numpy; the export itself is stdlib-only.
      - name: Install fetch dependency
        run: pip install yfinance

      - name: Fetch screener fundamentals (best effort)
        # Yahoo throttles CI runners sometimes. continue-on-error is deliberate:
        # the export renders an honest absence panel when the snapshot is missing.
        continue-on-error: true
        run: python tools/stock_screener.py fetch

      - name: Fetch screener prices (best effort)
        # Same contract as the fundamentals fetch: a throttled price endpoint must not
        # block publishing. Without it the price widget parks itself and says so.
        continue-on-error: true
        run: python tools/stock_screener.py prices

      - name: Check out the tone ledger branch (best effort)
        # The branch is created on first run. continue-on-error everywhere in the ledger
        # path: the ledger is strictly additive to this workflow — it must never become a
        # new way for the deploy to fail.
        continue-on-error: true
        run: |
          set -x
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code "$REMOTE" tone-ledger; then
            git clone --depth 1 --branch tone-ledger "$REMOTE" ledger
          else
            mkdir ledger && cd ledger
            git init -b tone-ledger
            git remote add origin "$REMOTE"
            cp ../docs/TONE_LEDGER.md README.md
            git add README.md
            git -c user.name=monad-tone-ledger -c user.email=actions@github.com \
                commit -m "tone-ledger: bootstrap (schema and pre-registered gates in README)"
          fi

      - name: Fetch Bloomberg/Reddit/Yahoo/StockTwits tone (best effort)
        # Tone-only: scores the screener's own universe from the public RSS feeds and
        # skips the per-ticker FUNDAMENTALS loop, which is the part that costs minutes.
        # Reddit rate-limits per IP, so a runner may get fewer subreddits than a laptop
        # does — that lands as reported coverage, never as a tone of 0.00.
        #
        # The Yahoo leg is itself one request per screened ticker (~5 min for 123 names,
        # measured), which is what buys near-universal coverage where the two firehose
        # feeds reach ~15%. It is inside this same step and needs no new one; a runner
        # that gets throttled gives up after 8 consecutive failures and publishes the
        # tickers it did reach, with the rest reported as not attempted.
        continue-on-error: true
        env:
          # Point the run's ledger rows into the tone-ledger checkout. If that checkout
          # failed, the path is still writable workspace and the push step below simply
          # finds no repository — degraded, never fatal.
          MONAD_TONE_LEDGER_DIR: ${{ github.workspace }}/ledger/data/tone_ledger
        run: python tools/screener_lab.py refresh --tone-only

      - name: Push the ledger rows (best effort)
        continue-on-error: true
        run: |
          set -x
          cd ledger
          git add -A data/tone_ledger
          git -c user.name=monad-tone-ledger -c user.email=actions@github.com \
              commit -m "tone: $(date -u +%Y-%m-%dT%H:%MZ) run ${{ github.run_number }}" \
            || exit 0        # nothing new (throttled run) is a fine outcome
          # Re-append on a fresh head if someone else pushed between clone and now —
          # never rebase the conflicting commit, just retry once on the new tip.
          git push origin tone-ledger \
            || (git pull --rebase origin tone-ledger && git push origin tone-ledger)

      - name: Export static site
        run: python tools/export_pages.py --out _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
